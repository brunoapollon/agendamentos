{% with mensagens = get_flashed_messages(with_categories=true) %}
{% if mensagens %}
<div class="mensagens">
  {% for categoria, texto in mensagens %}
  <p class="mensagem mensagem-{{ categoria }}" role="{{ 'alert' if categoria == 'erro' else 'status' }}">{{ texto }}</p>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
