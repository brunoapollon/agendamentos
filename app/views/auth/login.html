{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="entrada">
  <p class="marca-grande">AgendaCorte</p>
  <h1>Entrar na agenda da barbearia</h1>
  <form method="post" action="{{ url_for('auth.login', proximo=request.args.get('proximo')) }}" class="formulario">
    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus>
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="botao">Entrar</button>
  </form>
</section>
{% endblock %}
